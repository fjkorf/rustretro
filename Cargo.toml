[package]
name = "rustretro"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libloading = "0.8"
thiserror = "1.0"
anyhow = "1.0"
memoffset = "0.9"
bevy = { version = "0.18", features = ["serialize"] }
bevy_egui = "0.39"
egui_dock = { version = "0.18", features = ["serde"] }
cpal = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
capstone = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mlua = { version = "0.10", features = ["lua54", "vendored"] }

# litui (Markdown -> egui). Pinned to a specific commit so RustRetro and litui
# evolve independently — bump deliberately. The `[custom]` escape hatch (the
# bespoke-panel-as-page mechanism) landed at this rev. egui 0.33 matches our stack.
litui = { git = "https://github.com/fjkorf/litui.git", rev = "52847b93725911e833582d6c8b3d2dbe2eea4a07" }

# --- AI Wave 1: MCP server (only active behind the `--mcp` flag) ---
rmcp = { version = "1.7", features = ["server", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
axum = "0.8"

[build-dependencies]
# Compiles src/log_shim.c — the varargs bridge for the libretro log interface.
cc = "1"

[profile.release]
opt-level = 3
lto = true

# Fast edit-build-run loop (`cargo run --profile release-dev`). Deps stay fully
# optimized (built once, then cached); the leaf crate skips the fat-LTO merge
# that made every small release rebuild take ~6 minutes. Leaf opt-level is
# perf-irrelevant here: emulation runs in prebuilt libretro dylibs and
# rendering is in the (opt-3) bevy deps. Keep [profile.release] for shipping.
[profile.release-dev]
inherits = "release"
lto = false
incremental = true
codegen-units = 256
opt-level = 1

[profile.release-dev.package."*"]
opt-level = 3
codegen-units = 16
